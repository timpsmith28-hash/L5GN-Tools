[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "l5gntools"
version = "0.1.0"
description = "Estate-level, read-only scanners for the L5GN project family (CID-ready tool contract)."
requires-python = ">=3.10"
dependencies = []

# The core toolkit (scanners) is stdlib-only. The Chronicler ingest subsystem
# (chronicler/) is a separate writer with its own deps -- install on demand:
#   pip install -e .[chronicler]     # ingest pipeline (pyyaml + embeddings)
#   pip install -e .[scrape]         # gemini share-scraper (playwright)
#   pip install -e .[viewer]         # Datasette read surface (DECISIONS 0007 stage 1)
#   pip install -e .[review]         # the app tier (FastAPI/uvicorn) -- REQUIRED to run
#                                     # `run.py app`/`window`, not a truly optional bolt-on;
#                                     # kept as an extra (not [project.dependencies]) so the
#                                     # stdlib-only `l5gntools` package itself stays
#                                     # unweakened -- see DECISIONS 0034 clause 2. Also
#                                     # brings in httpx2, which starlette.testclient (used
#                                     # by tester_docs_board / tester_uat_sidebar via
#                                     # fastapi.testclient.TestClient) prefers over httpx --
#                                     # without it, every gate run that exercises those
#                                     # routes prints StarletteDeprecationWarning.
#   pip install -e .[desktop]        # `run.py window` -- pulls in .[review]'s deps too,
#                                     # since the window has nothing to open without them
#                                     # (COWORK_BRIEF_unified_app.md Task 5)
#
# `mesh` is deliberately empty: deposit/consume/intake's drop zone are
# stdlib-only, so there is no package to install. The gate is a machine
# config flag ("mesh": true in config/machines.json or config/local.json),
# not pip -- see l5gntools/config.py:mesh_enabled(). The extra exists so
# `pip install -e .[mesh]` reads correctly as documentation of the boundary
# (COWORK_BRIEF_unified_app.md Task 6 / DECISIONS 0036) even though it
# installs nothing.
[project.optional-dependencies]
chronicler = ["pyyaml>=6", "sentence-transformers>=2"]
scrape = ["playwright>=1.40"]
viewer = ["datasette>=0.64"]
review = ["fastapi>=0.110", "uvicorn>=0.29", "httpx2"]
desktop = ["pywebview>=5", "fastapi>=0.110", "uvicorn>=0.29"]
mesh = []

# Only the importable package ships; run.py / verify.py / auditors / tests stay
# top-level dev scripts. CID depends on the `l5gntools` package alone.
[tool.setuptools]
packages = ["l5gntools", "l5gntools.scanners"]
